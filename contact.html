<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub — Contact & Registration Support</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container form-container">
  <h1>Student Contact & Query Form</h1>
  <p>Submit your query or support request to StudentHub administration.</p>

  <?php
  // Process submission directly on POST request
  if ($_SERVER["REQUEST_METHOD"] === "POST") {
      require_once "process-form.php";
  }
  ?>

  <form action="<?php echo htmlspecialchars($_SERVER["PHP_SELF"]); ?>" method="POST" novalidate>
    <!-- Full Name -->
    <div class="form-group">
      <label for="fullname">Full Name <span class="required">*</span></label>
      <input type="text" id="fullname" name="fullname" value="<?php echo isset($_POST['fullname']) ? htmlspecialchars($_POST['fullname']) : ''; ?>" required>
      <?php if (!empty($errors['fullname'])): ?>
        <span class="error-message" style="display:block;"><?php echo $errors['fullname']; ?></span>
      <?php endif; ?>
    </div>

    <!-- Email Address -->
    <div class="form-group">
      <label for="email">Email Address <span class="required">*</span></label>
      <input type="email" id="email" name="email" value="<?php echo isset($_POST['email']) ? htmlspecialchars($_POST['email']) : ''; ?>" required>
      <?php if (!empty($errors['email'])): ?>
        <span class="error-message" style="display:block;"><?php echo $errors['email']; ?></span>
      <?php endif; ?>
    </div>

    <!-- Mobile Number -->
    <div class="form-group">
      <label for="mobile">Mobile Number <span class="required">*</span></label>
      <input type="tel" id="mobile" name="mobile" value="<?php echo isset($_POST['mobile']) ? htmlspecialchars($_POST['mobile']) : ''; ?>" required>
      <?php if (!empty($errors['mobile'])): ?>
        <span class="error-message" style="display:block;"><?php echo $errors['mobile']; ?></span>
      <?php endif; ?>
    </div>

    <!-- Subject Category -->
    <div class="form-group">
      <label for="category">Query Category <span class="required">*</span></label>
      <select id="category" name="category" required>
        <option value="">-- Select Category --</option>
        <option value="Academic" <?php echo (isset($_POST['category']) && $_POST['category'] === 'Academic') ? 'selected' : ''; ?>>Academic Query</option>
        <option value="Technical" <?php echo (isset($_POST['category']) && $_POST['category'] === 'Technical') ? 'selected' : ''; ?>>Technical Issue</option>
        <option value="Admission" <?php echo (isset($_POST['category']) && $_POST['category'] === 'Admission') ? 'selected' : ''; ?>>Admission Support</option>
      </select>
      <?php if (!empty($errors['category'])): ?>
        <span class="error-message" style="display:block;"><?php echo $errors['category']; ?></span>
      <?php endif; ?>
    </div>

    <!-- Message -->
    <div class="form-group">
      <label for="message">Your Message <span class="required">*</span></label>
      <textarea id="message" name="message" rows="4" required><?php echo isset($_POST['message']) ? htmlspecialchars($_POST['message']) : ''; ?></textarea>
      <?php if (!empty($errors['message'])): ?>
        <span class="error-message" style="display:block;"><?php echo $errors['message']; ?></span>
      <?php endif; ?>
    </div>

    <button type="submit" class="btn btn-primary">Submit Query</button>
  </form>
</main>

</body>
</html>
