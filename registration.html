<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub — Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container form-container">
  <h1>Student Registration</h1>
  <p>Create your StudentHub account to access academic resources.</p>

  <form id="registration-form" novalidate>
    <!-- Full Name -->
    <div class="form-group">
      <label for="fullname">Full Name <span class="required">*</span></label>
      <input type="text" id="fullname" name="fullname" required aria-describedby="fullname-error">
      <span class="error-message" id="fullname-error" aria-live="polite"></span>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email Address <span class="required">*</span></label>
      <input type="email" id="email" name="email" required aria-describedby="email-error">
      <span class="error-message" id="email-error" aria-live="polite"></span>
    </div>

    <!-- Mobile Number -->
    <div class="form-group">
      <label for="mobile">Mobile Number <span class="required">*</span></label>
      <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" required aria-describedby="mobile-error">
      <span class="error-message" id="mobile-error" aria-live="polite"></span>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password <span class="required">*</span></label>
      <input type="password" id="password" name="password" required aria-describedby="password-error password-strength">
      <div id="password-meter" class="strength-meter"><div id="strength-bar" class="strength-bar"></div></div>
      <span id="password-strength" class="strength-text"></span>
      <span class="error-message" id="password-error" aria-live="polite"></span>
    </div>

    <!-- Confirm Password -->
    <div class="form-group">
      <label for="confirm-password">Confirm Password <span class="required">*</span></label>
      <input type="password" id="confirm-password" name="confirm-password" required aria-describedby="confirm-password-error">
      <span class="error-message" id="confirm-password-error" aria-live="polite"></span>
    </div>

    <!-- Course Selection -->
    <div class="form-group">
      <label for="course">Select Course <span class="required">*</span></label>
      <select id="course" name="course" required aria-describedby="course-error">
        <option value="">-- Choose a Course --</option>
        <option value="cs">B.Tech Computer Science</option>
        <option value="it">B.Tech Information Technology</option>
        <option value="ee">B.Tech Electrical Engineering</option>
      </select>
      <span class="error-message" id="course-error" aria-live="polite"></span>
    </div>

    <!-- Academic Year -->
    <div class="form-group">
      <label for="year">Academic Year <span class="required">*</span></label>
      <select id="year" name="year" required aria-describedby="year-error">
        <option value="">-- Choose Year --</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>
      <span class="error-message" id="year-error" aria-live="polite"></span>
    </div>

    <!-- Gender Radio Group -->
    <fieldset class="form-group">
      <legend>Gender <span class="required">*</span></legend>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>
      <span class="error-message" id="gender-error" aria-live="polite"></span>
    </fieldset>

    <!-- Terms and Conditions -->
    <div class="form-group checkbox-group">
      <label for="terms">
        <input type="checkbox" id="terms" name="terms" required aria-describedby="terms-error">
        I accept the Terms and Conditions <span class="required">*</span>
      </label>
      <span class="error-message" id="terms-error" aria-live="polite"></span>
    </div>

    <button type="submit" class="btn btn-primary">Create Account</button>
  </form>
</main>

<script src="reg.js"></script>
</body>
</html>
